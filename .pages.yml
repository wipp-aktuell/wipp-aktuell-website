media:
  input: public/uploads
  output: /uploads
  rename: true
content:
  - name: artikel
    label: Nachrichtenartikel
    type: collection
    path: content/articles
    format: json
    filename: "{year}-{month}-{day}-{title}.json"
    view:
      fields: [title, category, date, published]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Überschrift
        type: string
        required: true
      - name: category
        label: Rubrik
        type: select
        required: true
        options:
          values: [Aktuelles, Blaulicht, Verkehr, Politik, Wirtschaft, Veranstaltungen, Sport, Stadtgeschichte]
      - name: date
        label: Datum
        type: date
        required: true
      - name: summary
        label: Kurzbeschreibung
        type: text
        required: true
      - name: cover
        label: Titelbild (optional)
        type: image
      - name: image_alt
        label: Bildbeschreibung
        type: string
      - name: image_credit
        label: Bildnachweis (Fotograf/Quelle)
        type: string
        required: false
      - name: body
        label: Artikeltext
        type: rich-text
        options:
          format: markdown
      - name: published
        label: Veröffentlichen
        type: boolean
      - name: source
        label: Quellenhinweis (optional)
        type: string

  - name: werbung
    label: Werbeanzeigen
    type: collection
    path: content/ads
    format: json
    filename: "{primary}.json"
    view:
      fields: [title, company, placement, start_date, end_date, active]
      primary: title
    fields:
      - name: title
        label: Interner Anzeigenname
        type: string
        required: true

      - name: company
        label: Firmenname
        type: string
        required: true

      - name: placement
        label: Werbeplatz
        type: select
        required: true
        options:
          values:
            - Premium-Startseite
            - Standard-Startseite
            - Rubrikensponsor

      - name: category
        label: Zugeordnete Rubrik
        type: select
        options:
          values:
            - Aktuelles
            - Blaulicht
            - Verkehr
            - Politik
            - Wirtschaft
            - Veranstaltungen
            - Sport
            - Stadtgeschichte

      - name: image
        label: Werbebanner
        type: image

      - name: image_alt
        label: Bildbeschreibung
        type: string

      - name: description
        label: Werbetext
        type: text

      - name: target_url
        label: Zieladresse (https://...)
        type: string

      - name: start_date
        label: Startdatum
        type: date
        required: true

      - name: end_date
        label: Enddatum
        type: date
        required: true

      - name: active
        label: Anzeige aktiviert
        type: boolean

      - name: priority
        label: Priorität
        type: number
        default: 1

      - name: booking_number
        label: Auftragsnummer
        type: string

      - name: booking_status
        label: Buchungsstatus
        type: select
        options:
          values:
            - Angefragt
            - Reserviert
            - Bestätigt
            - Storniert

      - name: booking_note
        label: Interne Buchungsnotiz
        type: text

  - name: unternehmen
    label: Unternehmensvorstellungen
    type: collection
    path: content/companies
    format: json
    filename: "{primary}.json"
    view:
      fields: [title, company, category, published]
      primary: title
    fields:
      - name: title
        label: Überschrift
        type: string
        required: true

      - name: company
        label: Firmenname
        type: string
        required: true

      - name: category
        label: Branche
        type: select
        options:
          values:
            - Gastronomie
            - Einzelhandel
            - Handwerk
            - Dienstleistungen
            - Gesundheit
            - Immobilien
            - Sonstiges

      - name: summary
        label: Kurzbeschreibung
        type: text

      - name: cover
        label: Titelbild
        type: image

      - name: image_alt
        label: Bildbeschreibung
        type: string

      - name: image_credit
        label: Bildnachweis
        type: string

      - name: body
        label: Unternehmensvorstellung
        type: rich-text

      - name: website
        label: Unternehmenswebsite
        type: string

      - name: published
        label: Veröffentlichen
        type: boolean
        default: false
