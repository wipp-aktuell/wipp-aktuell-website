
name: Buchungsuebersicht erstellen


on:
  workflow_dispatch:
    inputs:
      startdatum:
        description: 'Beginn der Werbebuchung (JJJJ-MM-TT)'
        required: true
        type: string
      enddatum:
        description: 'Ende der Werbebuchung (JJJJ-MM-TT)'
        required: true
        type: string


permissions:
  contents: read

jobs:
  buchungsbericht:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Buchungsbericht erstellen
        env:
          BOOKING_START: ${{ inputs.startdatum }}
          BOOKING_END: ${{ inputs.enddatum }}
        run: python3 booking_report.py


      - name: CSV-Bericht bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: wipp-aktuell-buchungsuebersicht
          path: buchungsuebersicht.csv
          retention-days: 7
